
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Cost Function Lab{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --brand: #6d5dfc;
            --brand-dark: #5141d9;
            --brand-light: #eeebff;
            --page-bg: #e9eef8;
            --text-main: #172033;
            --text-muted: #64748b;
            --border-color: #dce3f0;
            --card-shadow: 0 8px 26px rgba(42, 56, 96, 0.09);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(
                    ellipse at top left,
                    rgba(109, 93, 252, 0.12),
                    transparent 38%
                ),
                radial-gradient(
                    ellipse at bottom right,
                    rgba(76, 110, 245, 0.09),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #edf1fa 0%,
                    #e5ebf6 50%,
                    #f0edfb 100%
                );
            background-attachment: fixed;
            color: var(--text-main);
            font-family: "Inter", Arial, sans-serif;
            font-size: 14px;
            line-height: 1.65;
        }

        /* Navigation */
        .app-navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(20, 27, 46, 0.97);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.14);
        }

        .navbar-inner {
            width: min(1180px, calc(100% - 40px));
            min-height: 76px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .brand-link {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #ffffff;
            text-decoration: none;
            min-width: 0;
        }

        .brand-link:hover {
            color: #ffffff;
        }

        .brand-mark {
            width: 43px;
            height: 43px;
            flex: 0 0 43px;
            display: grid;
            place-items: center;
            border-radius: 13px;
            background: linear-gradient(135deg, #a5b4fc, #6d5dfc);
            color: white;
            font-size: 24px;
            font-weight: 800;
            box-shadow: 0 5px 16px rgba(109, 93, 252, 0.35);
        }

        .brand-copy {
            display: flex;
            flex-direction: column;
            line-height: 1.35;
        }

        .brand-name {
            font-size: 17px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        .brand-subtitle {
            margin-top: 3px;
            color: #b7c2dc;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1.15px;
            text-transform: uppercase;
        }

        .nav-project-label {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #e2e8f0;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .nav-status-dot {
            width: 8px;
            height: 8px;
            flex: 0 0 8px;
            border-radius: 50%;
            background: #34d399;
            box-shadow: 0 0 0 4px rgba(52, 211, 153, 0.12);
        }

        /* Main layout */
        .app-container {
            width: min(1180px, calc(100% - 40px));
            margin: 0 auto;
            padding: 36px 0 24px;
        }

        /* Dashboard title */
        .page-heading {
            margin-bottom: 28px;
        }

        .page-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            color: var(--brand);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .page-heading h1 {
            margin: 0;
            color: #172033;
            font-size: clamp(27px, 3.5vw, 39px);
            font-weight: 800;
            letter-spacing: -1.4px;
            line-height: 1.2;
        }

        .page-heading p {
            max-width: 720px;
            margin: 12px 0 0;
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.8;
        }

        /* Content cards */
        .card {
            overflow: hidden;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(210, 219, 237, 0.9) !important;
            border-radius: 15px !important;
            box-shadow: var(--card-shadow);
            transition:
                transform 0.22s ease,
                box-shadow 0.22s ease,
                border-color 0.22s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: #c7c1ff !important;
            box-shadow: 0 13px 32px rgba(42, 56, 96, 0.13);
        }

        .card-body {
            padding: 26px !important;
        }

        .card h4 {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            color: #202b43;
            font-size: 18px;
            font-weight: 750;
            letter-spacing: -0.35px;
        }

        .card h4::before {
            width: 4px;
            height: 23px;
            flex: 0 0 4px;
            content: "";
            border-radius: 8px;
            background: linear-gradient(180deg, #a5b4fc, #6d5dfc);
        }

        .card h5 {
            color: #26334b;
            font-size: 15px;
            font-weight: 700;
        }

        .text-secondary {
            color: var(--text-muted) !important;
        }

        /* Buttons */
        .btn {
            min-height: 40px;
            padding: 10px 17px;
            border-radius: 9px;
            font-size: 12px;
            font-weight: 700;
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background-color 0.2s ease,
                border-color 0.2s ease;
        }

        .btn-primary {
            background: var(--brand);
            border-color: var(--brand);
            box-shadow: 0 4px 10px rgba(109, 93, 252, 0.18);
        }

        .btn-primary:hover,
        .btn-primary:focus-visible {
            background: var(--brand-dark);
            border-color: var(--brand-dark);
            transform: translateY(-2px);
            box-shadow: 0 7px 16px rgba(79, 70, 229, 0.28);
        }

        .btn-outline-primary {
            color: var(--brand);
            border-color: #c7c1ff;
            background: #ffffff;
        }

        .btn-outline-primary:hover,
        .btn-outline-primary:focus-visible {
            color: #ffffff;
            background: var(--brand);
            border-color: var(--brand);
            transform: translateY(-2px);
            box-shadow: 0 7px 16px rgba(79, 70, 229, 0.2);
        }

        .btn:active {
            transform: translateY(0) scale(0.98);
        }

        /* Form fields */
        .form-label {
            margin-bottom: 8px;
            color: #34415a;
            font-size: 12px;
            font-weight: 700;
        }

        .form-control,
        .form-select {
            min-height: 43px;
            border: 1px solid #dce2ed;
            border-radius: 9px;
            background-color: #ffffff;
            color: #243047;
            font-size: 13px;
            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #8b7fff;
            box-shadow: 0 0 0 4px rgba(109, 93, 252, 0.13);
        }

        .form-check {
            margin-bottom: 8px;
        }

        .form-check-input {
            border-color: #c5cddd;
            cursor: pointer;
        }

        .form-check-input:checked {
            background-color: var(--brand);
            border-color: var(--brand);
        }

        .form-check-input:focus {
            border-color: #8b7fff;
            box-shadow: 0 0 0 3px rgba(109, 93, 252, 0.12);
        }

        .form-check-label {
            color: #475569;
            cursor: pointer;
        }

        /* Dataset statistics */
        .bg-light {
            background: #f5f6fc !important;
        }

        .rounded.p-3 {
            border: 1px solid #e7eaf5;
            border-radius: 12px !important;
            transition:
                background-color 0.2s ease,
                border-color 0.2s ease;
        }

        .rounded.p-3:hover {
            background: #f0eeff !important;
            border-color: #d8d2ff;
        }

        .rounded.p-3 h3 {
            margin: 4px 0 0;
            color: #222e49;
            font-size: 27px;
            font-weight: 800;
            letter-spacing: -0.8px;
        }

        /* Tables */
        .table-responsive {
            border: 1px solid var(--border-color);
            border-radius: 10px;
        }

        .table {
            margin-bottom: 0;
            font-size: 12px;
            vertical-align: middle;
        }

        .table > :not(caption) > * > * {
            padding: 13px 14px;
            border-bottom-color: #e9edf4;
        }

        .table thead.table-dark th {
            background: #20283a;
            border-color: #333d51;
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        .table tbody tr {
            transition: background-color 0.18s ease;
        }

        .table-hover > tbody > tr:hover > * {
            background: #f1f0ff;
            color: #202b43;
        }

        /* Alerts */
        .alert {
            border: 1px solid transparent;
            border-radius: 11px;
            font-size: 13px;
        }

        .alert-success {
            color: #166534;
            background: #ecfdf3;
            border-color: #bbf7d0;
        }

        .alert-danger {
            color: #991b1b;
            background: #fef2f2;
            border-color: #fecaca;
        }

        .alert-info {
            color: #1e40af;
            background: #eff6ff;
            border-color: #bfdbfe;
        }

        .badge {
            padding: 6px 9px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
        }

        /* Graphs */
        img.img-fluid {
            display: block;
            max-width: 100%;
            height: auto;
            background: #ffffff;
            border: 1px solid #edf0f6;
            border-radius: 10px !important;
        }

        /* Footer */
        .app-footer {
            margin-top: 14px;
            padding: 22px 12px 8px;
            border-top: 1px solid #d8e0ef;
            color: #78849a;
            text-align: center;
            font-size: 11px;
            line-height: 1.8;
        }

        .app-footer strong {
            color: #475569;
            font-weight: 700;
        }

        /* Keyboard accessibility */
        a:focus-visible,
        button:focus-visible {
            outline: 3px solid rgba(129, 140, 248, 0.65);
            outline-offset: 3px;
        }

        /* Tablet and mobile */
        @media (max-width: 768px) {
            .navbar-inner {
                width: calc(100% - 28px);
                min-height: 68px;
                gap: 12px;
            }

            .brand-mark {
                width: 38px;
                height: 38px;
                flex-basis: 38px;
                border-radius: 11px;
                font-size: 21px;
            }

            .brand-name {
                font-size: 15px;
            }

            .brand-subtitle {
                font-size: 9px;
                letter-spacing: 0.8px;
            }

            .nav-project-label {
                max-width: 125px;
                font-size: 10px;
                line-height: 1.5;
            }

            .app-container {
                width: calc(100% - 28px);
                padding-top: 27px;
            }

            .page-heading {
                margin-bottom: 22px;
            }

            .page-heading h1 {
                letter-spacing: -0.8px;
            }

            .card-body {
                padding: 19px !important;
            }

            .card h4 {
                font-size: 16px;
            }

            .table > :not(caption) > * > * {
                padding: 10px;
            }
        }

        @media (max-width: 420px) {
            .nav-project-label {
                max-width: 95px;
                font-size: 9px;
            }

            .brand-subtitle {
                letter-spacing: 0.4px;
            }

            .card-body {
                padding: 15px !important;
            }

            .btn {
                max-width: 100%;
                white-space: normal;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <nav class="app-navbar">
        <div class="navbar-inner">
            <a class="brand-link" href="/">
                <span class="brand-mark" aria-hidden="true">∑</span>

                <span class="brand-copy">
                    <span class="brand-name">Cost Function Lab</span>
                    <span class="brand-subtitle">Linear Regression Analysis</span>
                </span>
            </a>

            <div class="nav-project-label">
                <span class="nav-status-dot" aria-hidden="true"></span>
                <span>Gradient Descent Experiments</span>
            </div>
        </div>
    </nav>

    <main class="app-container">
        {% block content %}{% endblock %}

        <footer class="app-footer">
            <strong>Cost Function Lab</strong>
            <span> · Cost Function Behaviour in Linear Regression</span>
            <div>Built with Python, Django, NumPy and Matplotlib</div>
        </footer>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
